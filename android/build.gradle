// dev.mediacache:alpha-video-ffmpegkit, the Android library on its own (no React Native).
// The React Native package builds these same sources from react-native/android/build.gradle.

buildscript {
    // Only when this directory is built on its own; inside an app, the app's plugin is used.
    if (project == rootProject) {
        repositories {
            google()
            mavenCentral()
        }
        dependencies {
            classpath 'com.android.tools.build:gradle:8.12.0'
        }
    }
}

apply plugin: 'com.android.library'

def safeExtGet(name, fallback) {
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback
}

group = 'dev.mediacache'
version = '1.0.0'

android {
    namespace 'dev.mediacache.alphavideo.ffmpegkit'
    compileSdk safeExtGet('compileSdkVersion', 36)

    defaultConfig {
        // FFmpegKit 6.0 needs API 24
        minSdk safeExtGet('minSdkVersion', 24)
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation 'androidx.annotation:annotation:1.9.1'
    // FFmpegKit with a VP9-only FFmpeg (github.com/MediaCacheDev/ffmpegkit-vp9). Brings in
    // com.arthenica:smart-exception-java through its POM.
    implementation 'dev.mediacache:ffmpegkit-vp9:6.0.0'
}

if (project == rootProject) {
    apply from: 'publish.gradle'
}
