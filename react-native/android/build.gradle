// The React Native package's Android module. It compiles the standalone library's sources
// (../../android) together with the React Native glue, because autolinking adds only this one
// Gradle project to the app.

def isNewArchitectureEnabled() {
    // Set by the app's gradle.properties, and always "true" from React Native 0.82
    return project.findProperty('newArchEnabled')?.toString() == 'true'
}

apply plugin: 'com.android.library'
if (isNewArchitectureEnabled()) {
    apply plugin: 'com.facebook.react'
}

def safeExtGet(name, fallback) {
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback
}

def coreDir = file('../../android')
def packageRoot = file('../..')

if (isNewArchitectureEnabled()) {
    // The codegen tasks look for package.json and the specs next to this folder; both are two
    // levels up, in the package root.
    tasks.named('generateCodegenSchemaFromJavaScript').configure {
        jsRootDir.set(file("${packageRoot}/react-native/src"))
        jsInputFiles.set(fileTree("${packageRoot}/react-native/src") { include '**/*.ts', '**/*.tsx', '**/*.js' })
    }
    tasks.named('generateCodegenArtifactsFromSchema').configure {
        packageJsonFile.set(file("${packageRoot}/package.json"))
    }
}

android {
    namespace 'dev.mediacache.alphavideo.ffmpegkit.reactnative'
    compileSdk safeExtGet('compileSdkVersion', 36)

    defaultConfig {
        // FFmpegKit 6.0 needs API 24
        minSdk safeExtGet('minSdkVersion', 24)
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            java.srcDirs = [
                'src/main/java',
                "${coreDir}/src/main/java",
                isNewArchitectureEnabled() ? 'src/newarch/java' : 'src/oldarch/java',
            ]
        }
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation 'com.facebook.react:react-android'
    // FFmpegKit with a VP9-only FFmpeg (github.com/MediaCacheDev/ffmpegkit-vp9). Brings in
    // com.arthenica:smart-exception-java through its POM.
    implementation 'dev.mediacache:ffmpegkit-vp9:6.0.0'
}
